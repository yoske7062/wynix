<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>WYNIX KPIs</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#111214;--card:#1a1b1e;--line:#2a2b2f;--ink:#f3f3f3;--gray:#9a9a9a;--acc:#E05A83}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Geist,system-ui,sans-serif;padding:32px 16px}
.wrap{max-width:1100px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:28px;font-weight:600;letter-spacing:-.02em}h1 b{color:var(--acc)}
.upd{color:var(--gray);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.tile span{color:var(--gray);font-size:13px}.tile b{display:block;font-size:34px;font-weight:600;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.tile small{color:var(--gray);font-size:12px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{font-size:14px;font-weight:500;color:var(--gray);margin-bottom:12px}
svg{width:100%;height:auto;display:block}
.list div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}.list div:last-child{border:0}
.legend{display:flex;gap:16px;font-size:12px;color:var(--gray);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.rule{margin-top:12px}.rule .bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}.rule .bar i{display:block;height:100%;background:var(--acc)}
form{max-width:360px;margin:80px auto;display:grid;gap:10px}input,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}button{background:var(--ink);color:var(--bg);cursor:pointer;font-weight:500}
.err{color:#ff7b7b;font-size:13px}
@media(max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap" id="root"></div>
<script src="/kpi.js"></script></body></html>
