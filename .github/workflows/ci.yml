name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache Swift and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            .build
            build
            /tmp/bottles_check
          key: ${{ runner.os }}-swiftpm-build-${{ hashFiles('**/Package.resolved', 'Package.swift', '**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-build-

      - name: Run launch validation
        run: bash scripts/check-all.sh

      - name: Upload check logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-all-logs-${{ github.run_attempt }}
          path: /tmp/wynix-check-*.log
          if-no-files-found: ignore

      - name: Verify app
        run: |
          codesign --verify --deep --strict "build/WYNIX.app"
          test "$(lipo -archs 'build/WYNIX.app/Contents/MacOS/MacSteamSetup')" = "arm64"
          test -f "build/WYNIX.app/Contents/Resources/en.lproj/Localizable.strings"
          test -f "build/WYNIX.app/Contents/Resources/localization.sh"

      - name: Verify DMG packaging
        timeout-minutes: 2
        run: |
          bash scripts/create_dmg.sh "build/WYNIX.app" "build/WYNIX-test.dmg"
          mount_dir="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "build/WYNIX-test.dmg"
          test -d "$mount_dir/WYNIX.app"
          test "$(readlink "$mount_dir/Applications")" = "/Applications"
          codesign --verify --deep --strict "$mount_dir/WYNIX.app"
          hdiutil detach "$mount_dir"
