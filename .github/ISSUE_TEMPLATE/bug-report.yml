name: Bug report
description: Report an installation, launch, shutdown, or shortcut problem.
title: "[Bug] "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve WYNIX. Please write the report in English.

  - type: input
    id: version
    attributes:
      label: WYNIX version
      placeholder: 0.21 (build 21)
    validations:
      required: true

  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      placeholder: MacBook Pro 14-inch, M4 Pro
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.6.2
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where did it fail?
      options:
        - Initial setup
        - Opening Windows Steam
        - Closing Windows Steam
        - Login window
        - Game shortcut
        - Game launch
        - Other
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Include the exact message and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Opened ...
        2. Clicked ...
        3. The app ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log or screenshot
      description: Optional. Remove account names, emails, and local paths first.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked that attached material contains no private or secret information.
          required: true
