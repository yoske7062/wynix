name: Game compatibility report
description: Tell us whether a Windows Steam game works. Successful games are welcome too.
title: "[Game] "
labels:
  - game-compatibility
body:
  - type: markdown
    attributes:
      value: |
        One report per game makes results easier to find.

  - type: input
    id: game
    attributes:
      label: Game title
      placeholder: Game title as shown in Steam
    validations:
      required: true

  - type: input
    id: appid
    attributes:
      label: Steam App ID
      description: Optional. It appears in the store URL.

  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works well
        - Works with minor issues
        - Launches but is not playable
        - Does not launch
        - Blocked by anti-cheat
    validations:
      required: true

  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      placeholder: MacBook Air, M2
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.6.2
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Mention graphics, audio, controller, performance, crashes, or any workaround.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked that attached material contains no private or secret information.
          required: true
